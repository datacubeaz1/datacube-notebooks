name: Build lab

# Checks that the lab still builds with the notebooks and datasets in
# content/. Publishing is done by Cloudflare Pages, which builds this
# repository itself (see README).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: jupyter lite build --contents content --output-dir dist
      - name: Datasets and notebooks are in the build
        run: |
          test -f dist/files/modul11-tarif.ipynb
          test -f dist/files/datasets/users_behavior.csv
